apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: flowforge
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 5173
  type: LoadBalancer  # Change to ClusterIP if using Ingress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: flowforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: flowforge-web:latest
        ports:
        - containerPort: 5173
          name: http
        env:
        - name: VITE_API_URL
          value: "http://api-service:4000"  # Update this to your external API URL in production
        livenessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
