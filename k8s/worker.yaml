apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: flowforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
      - name: wait-for-api
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z api-service 4000; do echo waiting for api; sleep 2; done']
      containers:
      - name: worker
        image: flowforge-worker:latest
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: flowforge-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: flowforge-secrets
              key: REDIS_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: flowforge-secrets
              key: JWT_SECRET
        - name: VAULT_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: flowforge-secrets
              key: VAULT_MASTER_KEY
        - name: LLM_PROVIDER
          value: "mock"  # Change to "openai" or "anthropic" as needed
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: flowforge-secrets
              key: OPENAI_API_KEY
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: flowforge-secrets
              key: ANTHROPIC_API_KEY
              optional: true
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: flowforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
