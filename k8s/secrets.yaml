apiVersion: v1
kind: Secret
metadata:
  name: flowforge-secrets
  namespace: flowforge
type: Opaque
stringData:
  # IMPORTANT: Replace these with actual values in production
  # Use kubectl create secret or sealed-secrets for real deployments
  DATABASE_URL: "postgresql://flowforge:CHANGE_ME@postgres-service:5432/flowforge"
  REDIS_URL: "redis://redis-service:6379"
  JWT_SECRET: "CHANGE_ME_TO_RANDOM_STRING"
  VAULT_MASTER_KEY: "CHANGE_ME_TO_32_BYTE_KEY_MINIMUM"
  OPENAI_API_KEY: ""  # Optional: add if using OpenAI
  ANTHROPIC_API_KEY: ""  # Optional: add if using Anthropic
